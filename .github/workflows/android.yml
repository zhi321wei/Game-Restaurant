name: Android APK

# 两种触发：
# 1. push 到 main —— 构建 debug APK 作为构件（Artifact），用于验证
# 2. 打 tag v*（如 v1.0）—— 构建并创建 GitHub Release，APK 作为附件
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Read version
        id: ver
        run: echo "v=$(tr -d '[:space:]' < version.txt)" >> "$GITHUB_OUTPUT"

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "romantic-restaurant-v${{ steps.ver.outputs.v }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: romantic-restaurant-v${{ steps.ver.outputs.v }}
          path: romantic-restaurant-v${{ steps.ver.outputs.v }}.apk

      - name: Extract changelog for this version
        if: startsWith(github.ref, 'refs/tags/')
        id: notes
        run: |
          awk "/^## v${{ steps.ver.outputs.v }} /{f=1;next} /^## v/{f=0} f" CHANGELOG.md > release_notes.md
          [ -s release_notes.md ] || echo "版本 v${{ steps.ver.outputs.v }}" > release_notes.md

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          files: romantic-restaurant-v${{ steps.ver.outputs.v }}.apk
