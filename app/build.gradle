plugins {
    id "com.android.application"
}

// 版本号规则：version.txt 里写 "1.0"，每次更新 +0.1（1.0 -> 1.1 -> 1.2 ...）
// versionCode 自动换算：1.0 -> 10，1.1 -> 11，以此类推
def ver = file("../version.txt").text.trim()
def parts = ver.split("\\.")
def vcode = parts[0].toInteger() * 10 + parts[1].toInteger()

android {
    namespace "com.zhi321wei.romanticrestaurant"
    compileSdk 34

    defaultConfig {
        applicationId "com.zhi321wei.romanticrestaurant"
        minSdk 26
        targetSdk 34
        versionCode vcode
        versionName ver
    }
}

dependencies {
}
