plugins {
    id "com.android.application"
}

// 版本号规则：version.txt 里写 "1.0"，每次更新 +0.1（1.0 -> 1.1 -> 1.2 ...）
// versionCode 自动换算：1.0 -> 10，1.1 -> 11，以此类推
def ver = file("../version.txt").text.trim()
def parts = ver.split("\\.")
def vcode = parts[0].toInteger() * 10 + parts[1].toInteger()

android {
    namespace "com.xiongrestaurant"
    compileSdk 34

    // v1.2 固定签名：debug/release 都用仓库里的 keystore.p12，
    // 保证每次发布的 APK 签名一致，新版本可直接覆盖安装且保留存档数据。
    signingConfigs {
        fixed {
            storeFile file("../keystore.p12")
            storePassword "romantic2026"
            keyAlias "rr"
            keyPassword "romantic2026"
            storeType "PKCS12"
        }
    }

    defaultConfig {
        applicationId "com.xiongrestaurant"
        minSdk 26
        targetSdk 34
        versionCode vcode
        versionName ver
    }

    buildTypes {
        release {
            signingConfig signingConfigs.fixed
            minifyEnabled false
        }
        debug {
            signingConfig signingConfigs.fixed
        }
    }
}

dependencies {
}
